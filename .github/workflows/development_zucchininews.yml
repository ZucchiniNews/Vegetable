name: Build and deploy ASP.Net Core app to Azure Web App - ZucchiniNews

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore ZucchiniMVC/Zucchinimvc.sln

      - name: Build
        run: dotnet build ZucchiniMVC/Zucchinimvc.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ZucchiniMVC/Zucchinimvc.csproj --configuration Release --no-build --output ./publish

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app

      - name: Verify contents
        run: ls -R ./app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ZucchiniNews"
          slot-name: "Production"
          package: ./app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A33A3476DBE24AB49CEC801EF8B13566 }}
